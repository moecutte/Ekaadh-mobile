[build]
  publish = "build/web"

# Upload a pre-built `build/web` (recommended).
# Git deploys need Flutter on the builder; prefer:
#   npx netlify-cli deploy --prod --dir=build/web

[[redirects]]
  from = "/api/*"
  to = "https://ekaadh.mahaysaa.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/storage/*"
  to = "https://ekaadh.mahaysaa.com/storage/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/images/*"
  to = "https://ekaadh.mahaysaa.com/images/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"
